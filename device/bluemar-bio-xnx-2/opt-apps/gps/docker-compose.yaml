
services:
  gps:
    image: europe-west1-docker.pkg.dev/nordfou-biodiversity/docker-registry-bio/gps:base
    container_name: gps
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: "host"
    user: "${USER_ID}:${GROUP_ID}"
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    group_add:
      - dialout
    environment:
      - ENV=test
    volumes:
      - /var/shared:/var/shared
