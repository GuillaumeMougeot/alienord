# Upload switches for the gcs uploader (gcs.service).
# Read at the start of every upload cycle (every 15 min). To apply a change immediately:
#   docker stop gcs        # systemd restarts it and it runs a cycle straight away
# Values: true/false (also yes/no, on/off, 1/0). A missing file means both true.

# false: nothing is uploaded and nothing is deleted; files stay in /media/data/{images,meta,recordings}
UPLOAD_ENABLED=false

# false: after a successful upload, files are moved to /media/data/uploaded/<dir>/ instead of deleted
DELETE_AFTER_UPLOAD=true
